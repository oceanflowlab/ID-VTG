name: idvtg

channels:
  - pytorch
  - nvidia
  - conda-forge

dependencies:
  - python=3.10

  # PyTorch
  - pytorch=2.1.0
  - torchvision=0.16.0
  - torchtext=0.16.0
  - torchdata=0.7.0
  - pytorch-cuda=12.1

  # Core scientific packages
  - numpy=1.24
  - scipy
  - h5py
  - pyyaml
  - tensorboard
  - nltk
  - openpyxl

  # Build tools
  - pip
  - setuptools=81.0.0
  - wheel
  - ninja

  - pip:
      - omegaconf==2.3.0
      - einops==0.8.1
      - transformers==4.26.1
      - timm==0.4.12
