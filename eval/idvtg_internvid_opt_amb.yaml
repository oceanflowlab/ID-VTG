model:
  text_net:
    name: transformer     # identity | transformer
    in_dim: 300           # input dimension
    embd_dim: 256         # embedding dimension
    n_heads: 4            # number of attention heads
    max_seq_len: 77       # max number of tokens in text query
    n_layers: 5           # number of transformer layers
    attn_pdrop: 0.0       # dropout rate for attention map
    proj_pdrop: 0.1       # dropout rate for projection
    path_pdrop: 0.1       # dropout rate for residual paths
    use_abs_pe: true      # whether to use absolute position encoding
    use_bkgd_token: false  # whether to add background token
    
  vid_net:
    name: transformer
    in_dim: 768           # input dimension
    embd_dim: 256         # embedding dimension
    n_heads: 4            # number of attention heads
    max_seq_len: 512      # max number of clips in video
    arch: [2, 0, 7]       # backbone architecture (embed | stem | branch)
    mha_win_size: 5       # window size for local self-attention
    attn_pdrop: 0.0       # dropout rate for attention map
    proj_pdrop: 0.1       # dropout rate for projection
    path_pdrop: 0.1       # dropout rate for residual paths
    use_abs_pe: true      # whether to use absolute position encoding

  comp_net:
    name: compose
    num_query_token: 32
    cross_attention_freq: 2
    embed_dim: 256
    max_txt_len: 32
    image_size: 224
    drop_path_rate: 0        
    

  visual_fusion:
    name: visual_xattn
    n_layers: 2           # number of fusion layers
    n_heads: 4            # number of attention heads
    attn_pdrop: 0.0       # dropout rate for attention map
    proj_pdrop: 0.1       # dropout rate for projection
    path_pdrop: 0.1       # dropout rate for residual path
    xattn_mode: adaln     # cross-attention mode
  
  text_fusion:
    name: xattn_slow_branch
    n_layers: 2           # number of fusion layers
    n_heads: 4            # number of attention heads
    attn_pdrop: 0.0       # dropout rate for attention map
    proj_pdrop: 0.1       # dropout rate for projection
    path_pdrop: 0.1       # dropout rate for residual path
    xattn_mode: adaln     # cross-attention mode
    
  distractor_generator:
    name: generator
    vid_dim: 256            # video feature dimension
    text_dim: 256           # query feature dimension
    n_layers: 2         # number of fusion layers
    n_heads: 4          # number of attention heads for MHA
    mha_win_size: 5    # local window size for MHA (0 for global attention)
    attn_pdrop: 0.0     # dropout rate for attention maps
    proj_pdrop: 0.1     # dropout rate for projection
    path_pdrop: 0.1

  fusion:
    name: xattn
    n_layers: 2           # number of fusion layers
    n_heads: 4            # number of attention heads
    attn_pdrop: 0.0       # dropout rate for attention map
    proj_pdrop: 0.1       # dropout rate for projection
    path_pdrop: 0.1       # dropout rate for residual path
    xattn_mode: adaln     # cross-attention mode

  cls_head:
    name: cls
    n_layers: 2           # number of conv layers (output layer excluded)
    prior_prob: 0.0       # prior probability for positive class

  reg_head:
    name: reg
    n_layers: 2           # number of conv layers (output layer excluded)

pt_gen:
  regression_range: 4     # normalized regression range
  sigma: 0.5              # controls overlap of regression ranges (1 for no overlap)

train:
  data:
    name: video_centric
    split: train
    anno_file: input_data/annotations/idvtg_internvid_val_amb.json
    vid_feat_dir: input_data/video_feat/idvtg_internvid_video_feat
    text_feat_dir: null
    image_feat_dir: input_data/image_feat/idvtg_internvid_val_img_feat
    ext_score_dir: null
    ext_image_dir: null #/network_space/storage43/huzhuofan/Datasets/anet/crop
    tokenizer: glove

    clip_size: 1
    clip_stride: 1
    downsample_rate: 1    # downsampling stride for video features
    to_fixed_len: False    # whether to resize video to fixed length
    crop_ratio: null      # crop ratio for video features
    max_num_text: 10    # max number of text queries per video
  batch_size: 2
  num_workers: 4

  epochs: 14
  warmup_epochs: 6
  ema_beta: 0.999

  center_sampling: radius
  center_sampling_radius: 1.5

  loss_norm: 160
  loss_weight: 2.0
  reg_loss: diou          # iou | diou

  optimizer:
    name: adamw
    lr: 2.e-4
    text_net_lr: 2.e-4
    comp_net_lr: 2.e-4
    weight_decay: 0.05
  clip_grad_norm: 1.0

  scheduler:
    name: multistep      # cosine | multistep
    steps: [10]
    
eval:
  data:
    name: video_centric
    split: val
  multi_level: True
  level: ["both","text_ambiguity","image_ambiguity"]

  ranks: [1,5]
  iou_threshs: [0.3, 0.5, 0.7]

  pre_nms_topk: 2000
  pre_nms_thresh: 0.001
  seg_len_thresh: 0.1

  nms:
    mode: soft_nms
    iou_thresh: 0.1
    min_score: 0.001
    max_num_segs: 5
    sigma: 0.9
    voting_thresh: 0.95

log:
  log_interval: 100
  checkpoint_epochs: [10, 11, 12, 13, 14]